# Copy to config.yaml and edit. config.yaml is gitignored.
#
# No API key is read from this file — keys come from environment variables, so
# this stays safe to share.

host: 0.0.0.0          # Tailscale-only in practice; the firewall stays closed
port: 8765
db_path: juno.db
timezone: Europe/London
user_name: Aoi

# Every client must present this. Generate with: openssl rand -hex 32
# Can also be supplied as JUNO_AUTH_TOKEN, which takes precedence.
auth_token: ""

models:
  # Engines Juno can think with. `openai` covers anything speaking OpenAI's
  # chat-completions API — Gemini, Ollama, Cerebras, OpenRouter. API keys come
  # from the environment, never from this file.
  #
  # You only need to name what differs from the built-in defaults.
  engines:
    gemini:
      model: gemini-2.5-flash      # free tier, no card
    local:
      model: qwen3:4b              # Ollama on this box
    # claude:
    #   model: claude-haiku-4-5    # needs ANTHROPIC_API_KEY and a card

  # Which engine handles what. These paths have genuinely different needs.
  #
  # Conversation is low-volume and you are waiting for it, so it wants the
  # fastest engine available.
  conversation: gemini
  # Check-ins are high-volume AND carry your activity timeline — your screen
  # contents. Keeping them local means that never reaches a free tier that
  # trains on your data. The cost is judgement: run
  #   python -m juno.evals.checkin --engine gemini --engine local
  # to see how much you are giving up before deciding.
  checkin: local
  # Used whenever the role's engine is unavailable or errors.
  fallback: local

  max_tokens: 1024

voice:
  wake_word: hey_juno
  wake_word_fallback: hey_jarvis       # used until the custom model is trained
  wake_threshold: 0.6                  # raise if it triggers on normal speech
  kokoro_voice: af_heart               # run `juno-audition` to pick by ear
  kokoro_speed: 1.0
  whisper_model: base.en
  whisper_compute: int8
  endpoint_silence_ms: 700

# Private subscription URL for your calendar — Google, Radicale, Nextcloud and
# Fastmail all expose one. Full CalDAV is not needed just to read it.
# Can also be supplied as JUNO_CALENDAR_URL.
calendar_ics_url: ""

home_assistant:
  url: "http://homeassistant.local:8123"   # run HA on your LAN, not the VPS
  token: ""                                # or JUNO_HA_TOKEN, which wins
  # Never touched, by entity id or `domain.*` glob. Locks and garage doors are
  # the obvious candidates. Anything in the lock/cover/alarm/vacuum domains
  # additionally needs explicit spoken confirmation even when not listed here.
  forbidden:
    - lock.front_door

proactivity:
  level: 7                # 0 = only when spoken to, 10 = drill sergeant
  quiet_hours: [23, 8]    # she starts no conversations between these hours
  check_in_minutes: [20, 40]

  # Apps that count as doomscrolling, and the minutes of unbroken use before
  # the first nudge. Used from Phase 3 onward.
  scroll_apps:
    com.instagram.android: 15
    com.zhiliaoapp.musically: 10   # TikTok
    com.reddit.frontpage: 20
    com.twitter.android: 15
    com.google.android.youtube: 25
