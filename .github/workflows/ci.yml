name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A push to a branch with an open PR fires both triggers; group by sha so
  # each commit is built once rather than twice.
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  brain:
    name: Brain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        working-directory: brain
        run: pip install -e ".[dev,calendar]"
      - name: Test
        working-directory: brain
        run: python -m pytest -q

  laptop:
    name: Laptop client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The voice stack needs PortAudio headers to build, and the tests here
      # cover the pure logic rather than the audio path, so install only what
      # those need.
      - name: Install
        working-directory: clients/laptop
        run: pip install numpy pyyaml websockets pytest pytest-asyncio
      - name: Test
        working-directory: clients/laptop
        run: python -m pytest -q

  phone:
    name: Phone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: clients/phone
        run: gradle test --no-daemon

      - name: Build debug APK
        working-directory: clients/phone
        run: gradle assembleDebug --no-daemon

      # Termux cannot run the Gradle/AGP build itself, so CI is how the APK
      # gets built at all. Attach it to the run for sideloading.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: juno-phone-debug
          path: clients/phone/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
